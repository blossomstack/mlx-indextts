name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install portable tooling
        run: python -m pip install pytest pyyaml ruff build
      - name: Critical lint and syntax
        run: |
          ruff check --select E9,F63,F7,F82 mlx_indextts scripts tests
          python -m compileall -q mlx_indextts scripts tests
      - name: Model contracts (no GPU or weights)
        run: python scripts/run_portable_tests.py
      - name: Build source and wheel distributions
        run: python -m build
